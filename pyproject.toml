[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bmsdna"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "bmsdna/devtools/skills"

[project]
name = "bmsdna-devtools"
version = "0.30.0"
description = "Shared Azure DevOps / GitHub / git / Azure Monitor developer tooling for BMS projects"
readme = "README.md"
requires-python = ">=3.14"  # pgdevkit>=0.7.1 requires 3.14; was >=3.11 before adding it as a dependency
dependencies = [
    "requests>=2.32.0",
    "typer>=0.26.7",
    "rich>=13.0.0",
    # [db] extra: pgdevkit.testdb unconditionally imports pgdevkit.db.complex_types
    # (schema-apply machinery), which needs psycopg-pool/pydantic -- plain
    # `pgdevkit` alone fails to import pgdevkit.testdb. Possibly worth reporting
    # upstream, but harmless to depend on here either way.
    "pgdevkit[db]>=0.7.1",
]

# `sqlglot` is already a transitive dependency of pgdevkit today, but `bdt lint`'s SQL rules
# (lint_sql.py) import it directly -- an explicit optional extra documents that dependency and
# keeps `bdt lint` working even if pgdevkit ever drops it, without forcing it on everyone who
# only uses the PR/issue/worktree commands. `bdt lint` gives a clear install hint (not a raw
# ImportError) when it's missing either way (see lint_sql.require_sqlglot).
[project.optional-dependencies]
lint = ["sqlglot>=27.0.0"]

[project.scripts]
bdt = "bmsdna.devtools.cli:app"

[dependency-groups]
dev = [
    "ty>=0.0.59",
    "ruff>=0.14.0",
]
test = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
