[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bmsdna"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "bmsdna/devtools/skills"

[project]
name = "bmsdna-devtools"
version = "0.20.0"
description = "Shared Azure DevOps / GitHub / git / Azure Monitor developer tooling for BMS projects"
readme = "README.md"
requires-python = ">=3.14"  # pgdevkit>=0.7.1 requires 3.14; was >=3.11 before adding it as a dependency
dependencies = [
    "requests>=2.32.0",
    "typer>=0.26.7",
    "rich>=13.0.0",
    # [db] extra: pgdevkit.testdb unconditionally imports pgdevkit.db.complex_types
    # (schema-apply machinery), which needs psycopg-pool/pydantic -- plain
    # `pgdevkit` alone fails to import pgdevkit.testdb. Possibly worth reporting
    # upstream, but harmless to depend on here either way.
    "pgdevkit[db]>=0.7.1",
]

[project.scripts]
bdt = "bmsdna.devtools.cli:app"

[dependency-groups]
dev = [
    "ty>=0.0.59",
    "ruff>=0.14.0",
]
test = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
