[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bmsdna"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "bmsdna/devtools/skills"

[project]
name = "bmsdna-devtools"
version = "1.0.0"
description = "Shared Azure DevOps / GitHub / git / Azure Monitor developer tooling for BMS projects"
readme = "README.md"
requires-python = ">=3.14"  # pgdevkit>=0.7.1 requires 3.14; was >=3.11 before adding it as a dependency
dependencies = [
    "requests>=2.32.0",
    "azure-identity>=1.19.0",
    "tomli-w>=1.0.0",
    "typer>=0.26.7",
    "rich>=13.0.0",
    "packaging>=24.0",
    # [db] extra: pgdevkit.testdb unconditionally imports pgdevkit.db.complex_types
    # (schema-apply machinery), which needs psycopg-pool/pydantic -- plain
    # `pgdevkit` alone fails to import pgdevkit.testdb. Possibly worth reporting
    # upstream, but harmless to depend on here either way.
    "pgdevkit[db]>=0.7.1",
]

# `sqlglot` is already a transitive dependency of pgdevkit today, but `bdt lint`'s SQL rules
# (lint_sql.py) import it directly -- an explicit optional extra documents that dependency and
# keeps `bdt lint` working even if pgdevkit ever drops it, without forcing it on everyone who
# only uses the PR/issue/worktree commands. `bdt lint` gives a clear install hint (not a raw
# ImportError) when it's missing either way (see lint_sql.require_sqlglot).
[project.optional-dependencies]
lint = ["sqlglot>=27.0.0"]
# `bdt usage` (token usage of Claude Code / codex sessions per dev-workflow step): DuckDB reads the session logs,
# plotly renders the HTML report. Both are only imported when a `bdt usage` command runs, which prints an install
# hint when they are missing.
usage = ["duckdb>=1.3.0", "plotly>=5.24.0"]

[project.scripts]
bdt = "bmsdna.devtools.cli:app"

[dependency-groups]
dev = [
    "ty>=0.0.59",
    "ruff>=0.14.0",
]
test = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
namespace-packages = ["bmsdna"]  # no bmsdna/__init__.py: imports are bmsdna.devtools.*, not devtools.*
extend-exclude = ["*.md", ".worktrees", ".claude"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", "F", "I",   # pycodestyle, pyflakes, isort
    "UP",            # pyupgrade - X | None, modern syntax
    "B",             # bugbear - mutable defaults etc.
    "ANN",           # full type annotations
    "SIM", "C4",     # simplifiable code, needless comprehensions/casts
    "PERF", "FURB",  # needless loops, manual list/dict building
    "ASYNC",         # blocking calls inside async def
    "RUF",
    "N",             # PEP 8 naming
    "PTH",           # pathlib instead of os.path
    "TID",           # absolute imports only, banned APIs
    "RET", "PIE",    # consistent returns, misc simplifications
    "A",             # no shadowing builtins
    "T20",           # no print()
    "LOG",           # logging API misuse
    "DTZ",           # timezone-aware datetimes
    "FLY",           # f-string instead of str.join on literals
    "PLE", "PLW",    # pylint errors + warnings
]
ignore = [
    "ANN401",  # `Any` is a warning via the ruff-warn-any prek hook, not an error
    # `ruff format` owns code line length; what is left are ~230 long comments/docstrings/strings. Re-enable once they are wrapped.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# bdt is a CLI: print() is its output channel
"bmsdna/**" = ["T20"]
# tests: ~2200 untyped fixtures/helpers/fakes (and ty runs on bmsdna only, like CI). Annotate when a test file is next touched, then drop ANN here.
"tests/**" = ["T20", "ANN"]

[tool.ruff.lint.pep8-naming]
# ast.NodeVisitor dispatches on visit_<NodeClass> names
extend-ignore-names = ["visit_*"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = [".worktrees", ".claude"]
