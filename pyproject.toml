[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bmsdna"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "bmsdna/devtools/skills"

[project]
name = "bmsdna-devtools"
version = "0.15.0"
description = "Shared Azure DevOps / GitHub / git / Azure Monitor developer tooling for BMS projects"
readme = "README.md"
requires-python = ">=3.14"  # pgdevkit>=0.7.1 requires 3.14; was >=3.11 before adding it as a dependency
dependencies = [
    "requests>=2.32.0",
    "typer>=0.26.7",
    "rich>=13.0.0",
    # [db] extra: pgdevkit.testdb unconditionally imports pgdevkit.db.complex_types
    # (schema-apply machinery), which needs psycopg-pool/pydantic -- plain
    # `pgdevkit` alone fails to import pgdevkit.testdb. Possibly worth reporting
    # upstream, but harmless to depend on here either way.
    "pgdevkit[db]>=0.7.1",
]

[project.scripts]
bdt = "bmsdna.devtools.cli:app"

[dependency-groups]
dev = [
    "ty>=0.0.59",
    "ruff>=0.14.0",
]
test = [
    "pytest>=9.1.0",
]

# TEMPORARY: pgdevkit 0.7.1 (adding workspace_db_names()) isn't published to
# PyPI yet -- it's an open, unmerged PR (bmsuisse/pgdevkit#testdb-cli-orphaned-
# followups). Remove this override once that's merged and 0.7.1 is on PyPI;
# the >=0.7.1 constraint above is the real, intended one. Pinned to a commit
# SHA rather than the branch name itself: the branch can be force-pushed,
# rebased, or deleted (e.g. once its PR merges and it's cleaned up), which
# would otherwise make `uv sync`/CI installs here fail or silently resolve
# different code with no way to reproduce what was actually reviewed/tested.
[tool.uv.sources]
pgdevkit = { git = "https://github.com/bmsuisse/pgdevkit", rev = "c98219d0cdb96e7f6307b89f249ea32d21c11a0a" }

[tool.pytest.ini_options]
pythonpath = ["."]
